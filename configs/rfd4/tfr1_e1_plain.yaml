tfr1_e1_plain:
  input: 11qc.cif
  contig: "60-130, /0, A567-616, /0, B565-575"
  conditions:
    C_CRDGRP:
      1:
        - select: "sel('A/*/[567-616]') and is_protein_backbone and not has_nan_coord()"
        - select: "sel('B/*/[565-575]') and is_protein_backbone and not has_nan_coord()"
    C_SEQ:
      true:
        - select: "sel('A/*/[567-616]')"
        - select: "sel('B/*/[565-575]')"
    C_HOT:
      true:
        - select: "sel('A/*/586/[CE1,NE2]')"
        - select: "sel('A/*/583/[CB,OG]')"
        - select: "sel('A/*/585/[CB,OG]')"
        - select: "sel('A/*/593/[CD,OE1]')"
        - select: "sel('A/*/609/[CB,CG]')"
